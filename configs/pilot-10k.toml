[run]
name = "pilot-10k"
seed = 1337
device = "mps"

[data]
dataset = "manas01-pilot-10k"
max_tokens = 10000
train_fraction = 0.90
validation_fraction = 0.10

[model]
block_size = 128
n_layer = 4
n_head = 4
n_embd = 192
ffn_multiplier = 4
dropout = 0.2
bias = true
tie_embeddings = true

[training]
batch_size = 16
gradient_accumulation_steps = 1
max_steps = 3000
eval_interval = 100
eval_batches = 20
log_interval = 20
learning_rate = 0.0005
min_learning_rate = 0.00005
warmup_steps = 100
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
gradient_clip = 1.0
fixed_batch = false
early_stop_patience = 8
target_train_loss = 0.0

[generation]
prompt = "Манас"
max_new_tokens = 120
temperature = 0.8
top_k = 40
