[run]
name = "manas01-base"
seed = 1337
device = "mps"

[data]
dataset = "manas01-full"
max_tokens = 0
train_fraction = 0.90
validation_fraction = 0.05

[model]
block_size = 256
n_layer = 6
n_head = 8
n_embd = 256
ffn_multiplier = 4
dropout = 0.2
bias = true
tie_embeddings = true

[training]
batch_size = 8
gradient_accumulation_steps = 2
max_steps = 3000
eval_interval = 100
eval_batches = 30
log_interval = 20
learning_rate = 0.0003
min_learning_rate = 0.00003
warmup_steps = 100
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
gradient_clip = 1.0
fixed_batch = false
early_stop_patience = 6
target_train_loss = 0.0

[generation]
prompt = "Манас"
max_new_tokens = 200
temperature = 0.8
top_k = 40
