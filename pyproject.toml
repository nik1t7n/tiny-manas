[project]
name = "manas-gpt"
version = "0.1.0"
description = "Tiny Manas: a small decoder-only Transformer trained on the Kyrgyz epic Manas"
readme = "README.md"
authors = [
  { name = "Nikita Nosov" },
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2,<3",
  "tokenizers>=0.22,<1",
  "torch>=2.11,<3",
]

[project.scripts]
manas-gpt = "manas_gpt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manas_gpt"]

[tool.uv]
package = true
